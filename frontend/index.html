<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>PrInt - Chat</title>

  <style>
    body {
      font-family: Arial;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .chat {
      width: 400px;
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .messages {
      height: 300px;
      overflow-y: auto;
      margin-bottom: 10px;
    }

    .msg {
      margin: 5px 0;
    }

    .bot {
      color: blue;
    }

    .user {
      text-align: right;
      color: green;
    }

    button {
      margin: 5px;
      padding: 10px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="chat">
  <div class="messages" id="messages"></div>

  <div id="controls">
    <input id="input" placeholder="Digite seu sintoma..." />
    <button onclick="iniciar()">Iniciar</button>
  </div>
</div>

<script>
let sessionId = null;

function addMessage(text, type="bot") {
  const msg = document.createElement("div");
  msg.className = "msg " + type;
  msg.innerText = text;
  document.getElementById("messages").appendChild(msg);
}

async function iniciar() {
  const input = document.getElementById("input").value;

  addMessage(input, "user");

  const res = await fetch("http://127.0.0.1:8000/triagem/iniciar", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      sintomas: [input]
    })
  });

  const data = await res.json();

  sessionId = data.session_id;

  document.getElementById("controls").innerHTML = `
    <button onclick="responder(true)">Sim</button>
    <button onclick="responder(false)">Não</button>
  `;

  addMessage(data.pergunta, "bot");
}

async function responder(valor) {
  addMessage(valor ? "Sim" : "Não", "user");

  const res = await fetch("http://127.0.0.1:8000/triagem/responder", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      session_id: sessionId,
      resposta: valor
    })
  });

  const data = await res.json();

  if (data.final) {
    addMessage("Resultado:", "bot");
    addMessage("Urgência: " + data.urgencia, "bot");
    addMessage(data.recomendacao, "bot");

    document.getElementById("controls").innerHTML = `
      <button onclick="location.reload()">Novo atendimento</button>
    `;

    return;
  }

  addMessage(data.pergunta, "bot");
}
</script>

</body>
</html>
